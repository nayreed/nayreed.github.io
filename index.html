
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nayreed</title>
    <meta name="description" content="Portfolio of Rezwan Ahmad Nayreed, Electronics and Communications Engineering student and research assistant at the University of Oulu." />
    <meta name="author" content="Rezwan Ahmad Nayreed" />
    <meta name="color-scheme" content="light dark" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/alien.svg" />
    <script>
      // Apply the saved (or system) site theme before first paint, then keep
      // the tab icon matched to the browser chrome color scheme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var favicon = document.getElementById("favicon");
          var browserTheme = window.matchMedia("(prefers-color-scheme: dark)");
          var syncFavicon = function () {
            if (favicon) favicon.href = browserTheme.matches ? "/alien-dark.svg" : "/alien-light.svg";
          };
          syncFavicon();
          if (browserTheme.addEventListener) {
            browserTheme.addEventListener("change", syncFavicon);
          } else if (browserTheme.addListener) {
            browserTheme.addListener(syncFavicon);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
