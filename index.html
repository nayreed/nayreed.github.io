
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nayreed</title>
    <meta name="description" content="Portfolio of Rezwan Ahmad Nayreed, Electronics and Communications Engineering student and research assistant at the University of Oulu." />
    <meta name="author" content="Rezwan Ahmad Nayreed" />
    <meta name="color-scheme" content="light dark" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/alien-light-0.svg" />
    <script>
      // Apply the saved (or system) site theme before first paint, then keep
      // the tab icon matched to the browser chrome color scheme.
      (function () {
        try {
          var favicon = document.getElementById("favicon");
          var browserTheme = window.matchMedia("(prefers-color-scheme: dark)");
          var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
          var faviconFrame = 0;
          var faviconTimer;
          var faviconVersion = "?v=hands-1";
          var lightFrames = [
            "/alien-light-0.svg",
            "/alien-light-1.svg",
            "/alien-light-2.svg",
            "/alien-light-3.svg",
            "/alien-light-4.svg",
            "/alien-light-5.svg",
            "/alien-light-6.svg",
            "/alien-light-7.svg"
          ];
          var darkFrames = [
            "/alien-dark-0.svg",
            "/alien-dark-1.svg",
            "/alien-dark-2.svg",
            "/alien-dark-3.svg",
            "/alien-dark-4.svg",
            "/alien-dark-5.svg",
            "/alien-dark-6.svg",
            "/alien-dark-7.svg"
          ];

          var readStoredTheme = function () {
            var stored = localStorage.getItem("theme");
            return stored === "dark" || stored === "light" ? stored : null;
          };

          var applySiteTheme = function () {
            var stored = readStoredTheme();
            var dark = stored === "dark" || (!stored && browserTheme.matches);
            document.documentElement.classList.toggle("dark", dark);
            window.dispatchEvent(new CustomEvent("theme-change", { detail: dark ? "dark" : "light" }));
          };

          var syncFavicon = function () {
            if (!favicon) return;
            var frames = browserTheme.matches ? darkFrames : lightFrames;
            if (reducedMotion.matches) {
              favicon.href = frames[0] + faviconVersion;
              return;
            }
            favicon.href = frames[faviconFrame++ % frames.length] + faviconVersion;
          };

          var startFavicon = function () {
            if (faviconTimer) window.clearInterval(faviconTimer);
            faviconFrame = 0;
            syncFavicon();
            if (!reducedMotion.matches) {
              faviconTimer = window.setInterval(syncFavicon, 220);
            }
          };
          applySiteTheme();
          startFavicon();
          var handleBrowserThemeChange = function () {
            applySiteTheme();
            startFavicon();
          };
          if (browserTheme.addEventListener) {
            browserTheme.addEventListener("change", handleBrowserThemeChange);
          } else if (browserTheme.addListener) {
            browserTheme.addListener(handleBrowserThemeChange);
          }
          if (reducedMotion.addEventListener) {
            reducedMotion.addEventListener("change", startFavicon);
          } else if (reducedMotion.addListener) {
            reducedMotion.addListener(startFavicon);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
